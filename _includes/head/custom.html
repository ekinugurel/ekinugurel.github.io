<!-- BMLS visual consistency overrides -->
<style>
  /* Typography — match BMLS Lab */
  body {
    font-family: 'DM Sans', -apple-system, sans-serif !important;
    background-color: #FAFAF8 !important;
    color: #1A1712 !important;
  }

  h1, h2, h3 {
    font-family: 'DM Serif Display', Georgia, serif !important;
    color: #1A1712 !important;
    font-weight: 400 !important;
  }

  /* Masthead — warm white bar, UH red accent */
  .masthead {
    background-color: #FAFAF8 !important;
    border-bottom: 1px solid #E2DDD4 !important;
    backdrop-filter: blur(10px);
  }

  .masthead__menu-item a,
  .greedy-nav a {
    font-family: 'DM Sans', sans-serif !important;
    font-size: 13px !important;
    color: #7A6F63 !important;
    font-weight: 400 !important;
    letter-spacing: 0.01em;
    transition: color 0.15s ease !important;
  }

  .masthead__menu-item a:hover,
  .greedy-nav a:hover {
    color: #C8102E !important;
  }

  /* Site title in masthead */
  .masthead__menu-item--lg a {
    font-family: 'DM Serif Display', Georgia, serif !important;
    font-size: 17px !important;
    color: #1A1712 !important;
    font-weight: 400 !important;
  }

  .masthead__menu-item--lg a:hover {
    color: #C8102E !important;
  }

  /* BMLS Lab nav link — highlight it */
  .masthead__menu-item a[href*="bmls-lab"] {
    color: #C8102E !important;
    font-weight: 500 !important;
  }

  .masthead__menu-item a[href*="bmls-lab"]:hover {
    color: #a80e26 !important;
  }

  /* Links */
  a {
    color: #C8102E !important;
    transition: color 0.15s ease;
  }

  a:visited {
    color: #a80e26 !important;
  }

  a:hover {
    color: #a80e26 !important;
  }

  /* Author sidebar */
  .author__name {
    font-family: 'DM Serif Display', Georgia, serif !important;
    color: #1A1712 !important;
  }

  .author__bio {
    font-family: 'DM Sans', sans-serif !important;
    color: #7A6F63 !important;
    font-size: 13px !important;
  }

  .author__urls a {
    font-family: 'DM Sans', sans-serif !important;
    color: #7A6F63 !important;
    font-size: 13px !important;
  }

  .author__urls a:hover {
    color: #C8102E !important;
  }

  /* Page content */
  .page__content {
    font-family: 'DM Sans', sans-serif !important;
    color: #4A4238 !important;
    line-height: 1.75 !important;
  }

  .page__content p,
  .page__content li {
    font-size: 15px !important;
    color: #4A4238 !important;
  }

  .page__content strong {
    color: #1A1712 !important;
    font-weight: 600 !important;
  }

  /* Horizontal rules */
  hr {
    border-color: #E2DDD4 !important;
  }

  /* Footer */
  .page__footer {
    background-color: #1A1712 !important;
    border-top: none !important;
  }

  .page__footer-copyright {
    font-family: 'DM Sans', sans-serif !important;
    font-size: 12px !important;
    color: #7A6F63 !important;
  }

  /* Greedy nav button (mobile hamburger) */
  .greedy-nav button {
    background-color: transparent !important;
  }

  .navicon,
  .navicon::before,
  .navicon::after {
    background: #7A6F63 !important;
  }
</style>
